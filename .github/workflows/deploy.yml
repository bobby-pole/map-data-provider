name: Deploy to Production

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Provider Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.2"

      - name: Install Python dependencies
        run: cd backend && uv sync --locked --dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Full Provider Verification
        run: pnpm run verify:provider

  build-and-push:
    name: Build & Push to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/bobby-pole/map-data-provider:${{ github.sha }}
            ghcr.io/bobby-pole/map-data-provider:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Docker Compose configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/deploy/map-data-provider/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          DEMO_BUNDLE_ID: ${{ secrets.VPS_DEMO_BUNDLE_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_SHA,DEMO_BUNDLE_ID
          script: |
            set -e

            # Login to GHCR to pull image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u bobby-pole --password-stdin

            cd /home/deploy/map-data-provider
            mkdir -p data/prepared data/reviews data/runtime data/bundle/rybnik_35km

            # Keep the running image and the two newest rollback candidates, then
            # remove only older images from this application. This runs before
            # the pull so a new multi-gigabyte image cannot exhaust the root
            # filesystem while the previous image is still present.
            active_image_id="$(docker inspect --format '{{.Image}}' map-data-provider-prod 2>/dev/null || true)"
            keep_image_ids="$(docker image ls --no-trunc ghcr.io/bobby-pole/map-data-provider --format '{{.ID}} {{.CreatedAt}}' | sort -k2,3r | awk 'NR <= 2 {print $1}')"
            for image_id in $(docker image ls --no-trunc -q ghcr.io/bobby-pole/map-data-provider | sort -u); do
              if [ "$image_id" = "$active_image_id" ] || printf '%s\n' "$keep_image_ids" | grep -Fxq "$image_id"; then
                continue
              fi
              docker image rm "$image_id"
            done
            # Runtime cache is explicitly ephemeral; remove stale entries and
            # old unused BuildKit cache without touching prepared/bundle data.
            find data/runtime -type f -mtime +7 -delete
            find data/runtime -type d -empty -delete
            docker builder prune --force --filter "until=168h"
            available_kb="$(df -Pk / | awk 'NR == 2 {print $4}')"
            if [ -z "$available_kb" ] || [ "$available_kb" -lt 2097152 ]; then
              echo "Less than 2 GiB is available on the VPS after safe cleanup; refusing image pull."
              exit 1
            fi

            # Prepare only mutable state directories. The externally uploaded
            # bundle is intentionally not chowned or chmodded during deploy.
            chown -R 1001:1001 /home/deploy/map-data-provider/data/prepared /home/deploy/map-data-provider/data/reviews /home/deploy/map-data-provider/data/runtime
            chmod -R u=rwX,g=rX,o= /home/deploy/map-data-provider/data/prepared /home/deploy/map-data-provider/data/reviews /home/deploy/map-data-provider/data/runtime
            test -n "$DEMO_BUNDLE_ID"
            test -f data/bundle/rybnik_35km/demo_bundle_manifest.json

            # Set immutable image tag
            echo "MDQ_IMAGE_TAG=${GITHUB_SHA}" > .env
            echo "MDQ_DEMO_BUNDLE_ID=${DEMO_BUNDLE_ID}" >> .env

            # Pull and restart container
            docker compose -f docker-compose.prod.yml pull
            docker logout ghcr.io
            docker compose -f docker-compose.prod.yml up -d

            # Health check with retry (up to 60s)
            for i in $(seq 1 12); do
              if curl --silent --fail http://127.0.0.1:3001/api/health; then
                echo "Health check passed"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Health check failed after 60s"
                docker logs map-data-provider-prod --tail 30
                exit 1
              fi
              echo "Waiting for app... ($i/12)"
              sleep 5
            done
