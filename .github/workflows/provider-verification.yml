name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    name: verify-backend-python (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            pytest_paths: tests/test_aoi_runtime.py tests/test_worker.py
          - name: domain-packs-and-tiles
            pytest_paths: >-
              tests/test_domain_pack.py tests/test_pipeline_e2e.py tests/test_power_snapshot.py
              tests/test_transport.py tests/test_vector_tiles.py
          - name: provider-contracts
            pytest_paths: >-
              tests/test_adapters.py tests/test_aoi.py tests/test_bdot10k_adapter.py
              tests/test_bridges.py tests/test_cache.py tests/test_cross_source.py
              tests/test_district_heating.py tests/test_gas.py tests/test_industrial.py
              tests/test_issue_snapshot.py tests/test_pipeline_helpers.py tests/test_quality_rules.py
              tests/test_readiness_rules.py tests/test_sewer.py tests/test_source_availability.py
              tests/test_source_registry.py tests/test_source_strategy.py tests/test_telecom.py
              tests/test_water.py
          - name: source-adapters
            pytest_paths: >-
              tests/test_kiut_adapter.py tests/test_nmt_nmpt_raster_adapter.py
              tests/test_orthophoto_adapter.py tests/test_prg_adapter.py
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Run pytest shard with duration report
        working-directory: backend
        run: uv run pytest -q -W error --durations=20 ${{ matrix.pytest_paths }}

  backend-python-quality:
    name: verify-backend-python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Run ruff and smoke check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python tests/smoke_check.py

  failure-probes:
    name: verify-failure-probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parallel failure probes
        run: ./scripts/verify_contract_failure_probe.sh

  backend-node:
    name: verify-backend-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend-node verification
        run: pnpm run verify:node

  frontend:
    name: verify-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend verification
        run: pnpm run verify:frontend

  verify-gate:
    name: unit-tests
    needs: [backend-python, backend-python-quality, failure-probes, backend-node, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verification complete
        run: echo "All parallel verification gates passed successfully."
