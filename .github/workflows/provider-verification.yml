name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    name: verify-backend-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Run ruff, pytest and smoke check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q -W error
          uv run python tests/smoke_check.py

  failure-probes:
    name: verify-failure-probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parallel failure probes
        run: ./scripts/verify_contract_failure_probe.sh

  backend-node:
    name: verify-backend-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend-node verification
        run: pnpm run verify:node

  frontend:
    name: verify-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend verification
        run: pnpm run verify:frontend

  verify-gate:
    name: unit-tests
    needs: [backend-python, failure-probes, backend-node, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verification complete
        run: echo "All parallel verification gates passed successfully."
