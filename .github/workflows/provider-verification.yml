name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall -q geo_pipeline

      - name: Run Node unit tests
        run: pnpm --dir backend-node test

      - name: Type-check and build Node provider
        run: pnpm --dir backend-node run build

      - name: Lint Node provider
        run: pnpm --dir backend-node run lint

      - name: Run frontend unit tests
        run: pnpm --dir frontend test

      - name: Type-check and build frontend
        run: pnpm --dir frontend run build

      - name: Lint frontend
        run: pnpm --dir frontend run lint
