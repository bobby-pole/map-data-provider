[project]
name = "map-data-quality-lab-backend"
version = "0.1.0"
description = "FastAPI backend for a geospatial data quality tooling portfolio project."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "geopandas>=1.0.0",
    "osmnx>=2.0.0",
    "matplotlib>=3.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2==2.7.0",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
