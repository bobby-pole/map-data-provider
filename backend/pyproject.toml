[project]
name = "map-data-quality-lab-backend"
version = "0.1.0"
description = "FastAPI backend for a geospatial data quality tooling portfolio project."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "geopandas>=1.0.0",
    "osmnx>=2.0.0",
    "matplotlib>=3.8.0",
    "pyarrow>=20.0.0",
    "mapbox-vector-tile==2.2.0",
    "pmtiles==3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2==2.7.0",
    "pytest>=8.3,<9",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

